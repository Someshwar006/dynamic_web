<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign In • Dynamic Store & Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #eef2ff;
  --dark: #0f172a;
  --slate-800: #1e293b;
  --slate-600: #475569;
  --slate-400: #94a3b8;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --white: #ffffff;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 20px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #0b0f19;
  background-image: 
    radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.25) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.2) 0px, transparent 50%),
    radial-gradient(at 50% 50%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
  padding: 24px;
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--white);
  padding: 40px 32px;
  border-radius: var(--radius-lg);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.8);
}

.card-header {
  text-align: center;
  margin-bottom: 26px;
}

.logo-badge {
  width: 52px;
  height: 52px;
  background: var(--primary-light);
  color: var(--primary);
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin-bottom: 16px;
}

.card-header h2 {
  font-size: 24px;
  font-weight: 800;
  color: var(--dark);
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.card-header p {
  color: var(--slate-600);
  font-size: 14px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--slate-700);
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-sm);
  font-size: 14px;
  outline: none;
  background: var(--slate-50);
  transition: all 0.2s ease;
}

.form-group input:focus {
  border-color: var(--primary);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}

.btn-submit {
  width: 100%;
  padding: 13px;
  background: var(--primary);
  color: var(--white);
  font-weight: 700;
  font-size: 15px;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
  margin-top: 6px;
}

.btn-submit:hover {
  background: var(--primary-hover);
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
}

.card-footer {
  text-align: center;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--slate-100);
  font-size: 13.5px;
  color: var(--slate-600);
}

.card-footer a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
}

.card-footer a:hover {
  text-decoration: underline;
}

.back-home {
  display: block;
  text-align: center;
  margin-top: 14px;
  font-size: 13px;
  color: var(--slate-400);
  text-decoration: none;
  transition: color 0.2s;
}

.back-home:hover {
  color: var(--primary);
}
</style>
</head>

<body>

<div class="login-card">
  <div class="card-header">
    <div class="logo-badge">🔐</div>
    <h2>Sign In</h2>
    <p>Enter your email and password to continue</p>
  </div>

  <form action="/login" method="post" id="loginForm">
    <div class="form-group">
      <label for="emailInput">Email Address</label>
      <input type="email" id="emailInput" name="email" placeholder="name@example.com" required>
    </div>

    <div class="form-group">
      <label for="passInput">Password</label>
      <input type="password" id="passInput" name="password" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn-submit">Sign In</button>

    <div class="card-footer">
      Don’t have an account? <a href="/register">Create an Account</a>
    </div>

    <a href="/home" class="back-home">← Browse Storefront as Guest</a>
  </form>
</div>

<script>
// If opened in VS Code Live Server (port 5500/5501), automatically redirect to the running Express app on port 9000
if (window.location.port === '5500' || window.location.port === '5501') {
  window.location.replace('http://localhost:9000/login');
}
</script>

</body>
</html>
