<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders Management • Admin Hub</title>

<style>
:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #eef2ff;
  --dark: #0f172a;
  --slate-800: #1e293b;
  --slate-600: #475569;
  --slate-500: #64748b;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --white: #ffffff;
  --emerald: #10b981;
  --emerald-light: #d1fae5;
  --amber: #f59e0b;
  --amber-light: #fef3c7;
  --sky: #0ea5e9;
  --sky-light: #e0f2fe;
  --rose: #ef4444;
  --rose-light: #fee2e2;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  background: #f8fafc;
  color: var(--dark);
  padding: 36px 20px;
  min-height: 100vh;
}

.container {
  max-width: 1300px;
  margin: 0 auto;
}

/* TOP HEADER */
.top-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--slate-200);
}

.header-left h1 {
  font-size: 26px;
  font-weight: 800;
  color: var(--dark);
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-left p {
  color: var(--slate-500);
  font-size: 14px;
  margin-top: 4px;
}

.header-actions {
  display: flex;
  gap: 10px;
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s ease;
}

.btn-secondary {
  background: var(--white);
  color: var(--slate-600);
  border: 1px solid var(--slate-200);
}

.btn-secondary:hover {
  background: var(--slate-100);
}

.btn-primary {
  background: var(--primary);
  color: var(--white);
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
}

.btn-primary:hover {
  background: var(--primary-hover);
}

/* METRICS STATS */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.metric-card {
  background: var(--white);
  padding: 20px;
  border-radius: var(--radius-md);
  border: 1px solid var(--slate-200);
  box-shadow: var(--shadow-card);
  display: flex;
  align-items: center;
  gap: 16px;
}

.metric-icon {
  width: 50px;
  height: 50px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}

.metric-info h3 {
  font-size: 24px;
  font-weight: 800;
  color: var(--dark);
}

.metric-info p {
  font-size: 13px;
  color: var(--slate-500);
  margin-top: 2px;
}

/* FILTER & SEARCH BAR */
.controls-bar {
  background: var(--white);
  padding: 16px 20px;
  border-radius: var(--radius-md);
  border: 1px solid var(--slate-200);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-card);
}

.filter-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-btn {
  background: var(--slate-100);
  border: 1px solid transparent;
  color: var(--slate-600);
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.filter-btn.active, .filter-btn:hover {
  background: var(--primary-light);
  color: var(--primary);
  border-color: rgba(79, 70, 229, 0.2);
}

.search-input {
  padding: 8px 14px;
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-sm);
  font-size: 13px;
  width: 260px;
  outline: none;
}

.search-input:focus {
  border-color: var(--primary);
}

/* ORDER CARDS */
.order-card {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-md);
  margin-bottom: 20px;
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.order-top {
  padding: 16px 24px;
  background: #f8fafc;
  border-bottom: 1px solid var(--slate-200);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.order-main-info {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.order-id {
  font-family: monospace;
  font-size: 16px;
  font-weight: 800;
  color: var(--primary);
}

.order-date {
  font-size: 13px;
  color: var(--slate-500);
}

.customer-pill {
  background: #f1f5f9;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--slate-800);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* STATUS BADGES */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.status-pending { background: var(--amber-light); color: var(--amber); border: 1px solid #fde68a; }
.status-accepted { background: var(--sky-light); color: var(--sky); border: 1px solid #bae6fd; }
.status-out-for-delivery { background: #e0e7ff; color: #4338ca; border: 1px solid #c7d2fe; }
.status-delivered { background: var(--emerald-light); color: var(--emerald); border: 1px solid #a7f3d0; }
.status-cancelled { background: var(--rose-light); color: var(--rose); border: 1px solid #fecaca; }

.order-content {
  padding: 20px 24px;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 24px;
}

@media (max-width: 900px) {
  .order-content {
    grid-template-columns: 1fr;
  }
}

.order-items-list {
  border-right: 1px solid var(--slate-100);
  padding-right: 20px;
}

@media (max-width: 900px) {
  .order-items-list {
    border-right: none;
    padding-right: 0;
    border-bottom: 1px solid var(--slate-100);
    padding-bottom: 20px;
  }
}

.item-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--slate-200);
}

.item-row:last-child {
  border-bottom: none;
}

.item-thumb {
  width: 56px;
  height: 56px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  border: 1px solid var(--slate-200);
}

.item-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--dark);
}

.item-calc {
  font-size: 13px;
  color: var(--slate-500);
  margin-top: 2px;
}

.item-total {
  font-weight: 700;
  font-size: 14px;
  color: var(--dark);
  margin-left: auto;
}

.customer-details-box {
  background: #f8fafc;
  padding: 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--slate-200);
  font-size: 13px;
  line-height: 1.6;
}

.customer-details-box strong {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  color: var(--slate-500);
  margin-bottom: 4px;
}

/* ACTIONS BAR */
.order-bottom {
  padding: 14px 24px;
  background: #ffffff;
  border-top: 1px solid var(--slate-200);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
}

.order-grand-total {
  font-size: 16px;
  font-weight: 800;
  color: var(--dark);
}

.order-actions {
  display: flex;
  gap: 8px;
}

.action-btn {
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.btn-accept {
  background: var(--primary);
  color: var(--white);
}

.btn-accept:hover {
  background: var(--primary-hover);
}

.btn-ship {
  background: var(--sky);
  color: var(--white);
}

.btn-ship:hover {
  background: #0284c7;
}

.btn-deliver {
  background: var(--emerald);
  color: var(--white);
}

.btn-deliver:hover {
  background: #059669;
}

.btn-cancel {
  background: #fee2e2;
  color: #dc2626;
  border: 1px solid #fecaca;
}

.btn-cancel:hover {
  background: #fecaca;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  background: var(--white);
  border-radius: var(--radius-md);
  border: 1px dashed var(--slate-200);
  color: var(--slate-500);
}
</style>
</head>
<body>

<div class="container">

  <!-- TOP HEADER -->
  <div class="top-header">
    <div class="header-left">
      <h1>📦 Customer Orders Management</h1>
      <p>Accept incoming orders, dispatch packages, and mark deliveries in real-time</p>
    </div>
    <div class="header-actions">
      <a href="/controls" class="nav-btn btn-secondary">← Back to Dashboard</a>
      <a href="/home" target="_blank" class="nav-btn btn-primary">👁️ Live Website</a>
    </div>
  </div>

  <!-- METRICS CARDS -->
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-icon" style="background:var(--primary-light); color:var(--primary);">📦</div>
      <div class="metric-info">
        <h3 id="statTotal">0</h3>
        <p>Total Orders</p>
      </div>
    </div>
    <div class="metric-card">
      <div class="metric-icon" style="background:var(--amber-light); color:var(--amber);">⏳</div>
      <div class="metric-info">
        <h3 id="statPending">0</h3>
        <p>Pending Acceptance</p>
      </div>
    </div>
    <div class="metric-card">
      <div class="metric-icon" style="background:var(--sky-light); color:var(--sky);">🚚</div>
      <div class="metric-info">
        <h3 id="statOut">0</h3>
        <p>In Transit</p>
      </div>
    </div>
    <div class="metric-card">
      <div class="metric-icon" style="background:var(--emerald-light); color:var(--emerald);">🎉</div>
      <div class="metric-info">
        <h3 id="statDelivered">0</h3>
        <p>Delivered</p>
      </div>
    </div>
  </div>

  <!-- FILTER & SEARCH BAR -->
  <div class="controls-bar">
    <div class="filter-tabs">
      <button class="filter-btn active" onclick="setFilter('all')">All Orders</button>
      <button class="filter-btn" onclick="setFilter('Pending')">⏳ Pending</button>
      <button class="filter-btn" onclick="setFilter('Accepted')">✅ Accepted</button>
      <button class="filter-btn" onclick="setFilter('Out for Delivery')">🚚 Out for Delivery</button>
      <button class="filter-btn" onclick="setFilter('Delivered')">🎉 Delivered</button>
      <button class="filter-btn" onclick="setFilter('Cancelled')">❌ Cancelled</button>
    </div>

    <input type="text" class="search-input" id="searchInput" oninput="renderOrders()" placeholder="🔍 Search Order ID, Customer, Phone...">
  </div>

  <!-- ORDERS LIST CONTAINER -->
  <div id="ordersContainer">
    <div class="empty-state">Loading customer orders...</div>
  </div>

</div>

<script>
let allOrders = [];
let currentFilter = 'all';

async function fetchOrders() {
  try {
    const res = await fetch('/api/admin/orders');
    allOrders = await res.json();
    updateMetrics();
    renderOrders();
  } catch (err) {
    document.getElementById('ordersContainer').innerHTML = `<div class="empty-state" style="color:#ef4444;">Failed to load orders: ${err.message}</div>`;
  }
}

function updateMetrics() {
  document.getElementById('statTotal').innerText = allOrders.length;
  document.getElementById('statPending').innerText = allOrders.filter(o => o.status === 'Pending').length;
  document.getElementById('statOut').innerText = allOrders.filter(o => o.status === 'Out for Delivery' || o.status === 'Accepted').length;
  document.getElementById('statDelivered').innerText = allOrders.filter(o => o.status === 'Delivered').length;
}

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.innerText.includes(filter) || (filter === 'all' && btn.innerText === 'All Orders'));
  });
  renderOrders();
}

function renderOrders() {
  const container = document.getElementById('ordersContainer');
  const search = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  let filtered = allOrders;
  if (currentFilter !== 'all') {
    filtered = filtered.filter(o => o.status === currentFilter);
  }

  if (search) {
    filtered = filtered.filter(o => 
      (o.orderId && o.orderId.toLowerCase().includes(search)) ||
      (o.userName && o.userName.toLowerCase().includes(search)) ||
      (o.userEmail && o.userEmail.toLowerCase().includes(search)) ||
      (o.phone && o.phone.toLowerCase().includes(search))
    );
  }

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <span style="font-size:40px; display:block; margin-bottom:8px;">📦</span>
        <h3>No matching orders found</h3>
        <p>There are no customer orders matching the selected filter or search term.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = filtered.map(order => {
    const dateStr = new Date(order.createdAt).toLocaleDateString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });

    const statusClass = {
      'Pending': 'status-pending',
      'Accepted': 'status-accepted',
      'Out for Delivery': 'status-out-for-delivery',
      'Delivered': 'status-delivered',
      'Cancelled': 'status-cancelled'
    }[order.status] || 'status-pending';

    const statusIcon = {
      'Pending': '⏳',
      'Accepted': '✅',
      'Out for Delivery': '🚚',
      'Delivered': '🎉',
      'Cancelled': '❌'
    }[order.status] || '⏳';

    return `
      <div class="order-card" id="card-${order.orderId}">
        <div class="order-top">
          <div class="order-main-info">
            <span class="order-id">#${order.orderId}</span>
            <span class="order-date">📅 ${dateStr}</span>
            <span class="customer-pill">👤 ${escapeHtml(order.userName)} (${escapeHtml(order.userEmail)})</span>
          </div>
          <div class="status-badge ${statusClass}">
            <span>${statusIcon}</span> ${order.status}
          </div>
        </div>

        <div class="order-content">
          <div class="order-items-list">
            <div style="font-size:12px; font-weight:700; color:var(--slate-500); text-transform:uppercase; margin-bottom:8px;">Items Ordered (${order.items.length})</div>
            ${order.items.map(item => `
              <div class="item-row">
                <img class="item-thumb" src="/uploads/${item.image}" onerror="this.src='https://via.placeholder.com/60?text=Item'" alt="${escapeHtml(item.name)}">
                <div>
                  <div class="item-title">${escapeHtml(item.name)}</div>
                  <div class="item-calc">Quantity: <strong>${item.quantity || 1}</strong> × ₹${item.price}</div>
                </div>
                <div class="item-total">₹${(item.price * (item.quantity || 1))}</div>
              </div>
            `).join('')}
          </div>

          <div class="customer-details-box">
            <strong>Shipping & Contact Details</strong>
            <div><strong>Recipient:</strong> ${escapeHtml(order.userName)}</div>
            <div><strong>Phone:</strong> ${order.phone ? `📞 ${escapeHtml(order.phone)}` : '<span style="color:#94a3b8;">Not provided</span>'}</div>
            <div style="margin-top:6px;">
              <strong>Delivery Address:</strong>
              ${order.shippingAddress?.address ? `
                ${escapeHtml(order.shippingAddress.address)}<br>
                ${escapeHtml(order.shippingAddress.city || '')} ${escapeHtml(order.shippingAddress.state || '')} - ${escapeHtml(order.shippingAddress.pincode || '')}
              ` : '<span style="color:#94a3b8;">No delivery address specified</span>'}
            </div>
            <div style="margin-top:6px; color:var(--slate-500);">
              <strong>Payment Method:</strong> ${escapeHtml(order.paymentMethod || 'Cash on Delivery')}
            </div>
          </div>
        </div>

        <div class="order-bottom">
          <div class="order-grand-total">
            Total Payable: <span style="color:var(--primary); font-size:18px;">₹${order.totalAmount}</span>
            <span style="font-size:12px; font-weight:600; color:var(--slate-500); margin-left:6px;">(${escapeHtml(order.paymentMethod || 'COD')})</span>
          </div>

          <div class="order-actions">
            ${order.status === 'Pending' ? `
              <button class="action-btn btn-accept" onclick="updateStatus('${order.orderId}', 'Accepted')">
                <span>✅</span> Accept Order
              </button>
              <button class="action-btn btn-cancel" onclick="updateStatus('${order.orderId}', 'Cancelled')">
                <span>❌</span> Reject
              </button>
            ` : ''}

            ${order.status === 'Accepted' ? `
              <button class="action-btn btn-ship" onclick="updateStatus('${order.orderId}', 'Out for Delivery')">
                <span>🚚</span> Out for Delivery
              </button>
              <button class="action-btn btn-deliver" onclick="updateStatus('${order.orderId}', 'Delivered')">
                <span>📦</span> Mark Delivered
              </button>
            ` : ''}

            ${order.status === 'Out for Delivery' ? `
              <button class="action-btn btn-deliver" onclick="updateStatus('${order.orderId}', 'Delivered')">
                <span>🎉</span> Confirm Delivered
              </button>
            ` : ''}

            ${order.status === 'Delivered' ? `
              <span style="font-weight:700; color:var(--emerald); font-size:13px; display:inline-flex; align-items:center; gap:6px;">
                ✅ Order Fulfilled & Delivered
              </span>
            ` : ''}

            ${order.status === 'Cancelled' ? `
              <span style="font-weight:700; color:var(--rose); font-size:13px;">
                ❌ Order Cancelled
              </span>
            ` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

async function updateStatus(orderId, status) {
  if (!confirm(`Update Order #${orderId} status to "${status}"?`)) return;

  try {
    const res = await fetch('/api/admin/orders/update-status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderId, status })
    });
    const data = await res.json();
    if (data.success) {
      // Update local state
      const order = allOrders.find(o => o.orderId === orderId);
      if (order) order.status = status;
      updateMetrics();
      renderOrders();
    } else {
      alert(data.error || 'Failed to update order status');
    }
  } catch (err) {
    alert('Error updating status: ' + err.message);
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

fetchOrders();
// Polling for live updates every 15 seconds
setInterval(fetchOrders, 15000);
</script>

</body>
</html>
