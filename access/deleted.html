<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deleted Items • Recycle Bin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #eef2ff;
  --dark: #0f172a;
  --slate-700: #334155;
  --slate-500: #64748b;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --white: #ffffff;
  --radius-sm: 8px;
  --radius-md: 14px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  background: #f8fafc;
  color: var(--dark);
  padding: 40px 24px;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

.top-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--slate-200);
}

.header-left h1 {
  font-size: 26px;
  font-weight: 800;
  color: var(--dark);
}

.header-left p {
  color: var(--slate-500);
  font-size: 14px;
  margin-top: 4px;
}

.header-actions {
  display: flex;
  gap: 12px;
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s ease;
}

.btn-secondary {
  background: var(--white);
  color: var(--slate-700);
  border: 1px solid var(--slate-200);
}

.btn-secondary:hover {
  background: var(--slate-100);
}

.btn-primary {
  background: var(--primary);
  color: var(--white);
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}

.card {
  background: var(--white);
  border-radius: var(--radius-md);
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  border: 1px solid var(--slate-200);
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.path {
  font-size: 11px;
  font-family: monospace;
  color: var(--primary);
  background: var(--primary-light);
  padding: 4px 8px;
  border-radius: 4px;
  margin-bottom: 12px;
  word-break: break-all;
}

.preview {
  width: 100%;
  height: 160px;
  object-fit: contain;
  background: var(--slate-100);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
}

.value {
  font-size: 14px;
  color: var(--dark);
  line-height: 1.5;
  background: #f8fafc;
  padding: 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--slate-200);
  margin-bottom: 12px;
}

.meta {
  font-size: 12px;
  color: var(--slate-500);
  margin-bottom: 14px;
}

.actions {
  display: flex;
  margin-top: auto;
}

.btn {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  transition: all 0.2s ease;
}

.restore {
  background: #10b981;
  color: #fff;
}

.restore:hover {
  background: #059669;
}

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--slate-500);
  grid-column: 1 / -1;
  font-size: 16px;
}
</style>
</head>
<body>

<div class="container">
  <div class="top-header">
    <div class="header-left">
      <h1>Deleted Content Recycle Bin</h1>
      <p>Soft-deleted fields from the website. Restore items back to the live site anytime.</p>
    </div>
    <div class="header-actions">
      <a href="/controls" class="nav-btn btn-secondary">← Back to Dashboard</a>
      <a href="/list" class="nav-btn btn-primary">Edit Live Pages (/list)</a>
    </div>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none;">Recycle bin is empty. No deleted content found.</div>
</div>

<script>
async function loadDeleted(){
  try{
    const res = await fetch('/api/pages/deleted');
    const items = await res.json();
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    if(!Array.isArray(items) || items.length===0){
      document.getElementById('empty').style.display='block';
      return;
    }
    document.getElementById('empty').style.display='none';
    items.forEach(i=>{
      const card = document.createElement('div');
      card.className = 'card';
      const isImage = i.type==='image' && typeof i.value==='string';
      card.innerHTML = `
        <div class="path">${i.path}</div>
        ${isImage
          ? `<img class="preview" src="/uploads/${i.value}" onerror="this.src='https://via.placeholder.com/400x160?text=No+Image'">`
          : `<div class="value">${String(i.value)}</div>`
        }
        <div class="meta">Type: <strong>${i.type}</strong> • Deleted: ${new Date(i.deletedAt).toLocaleString()}</div>
        <div class="actions">
          <button class="btn restore" onclick="restore('${i._id}')">♻️ Restore to Website</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }catch(e){
    console.error(e);
  }
}

async function restore(id){
  try{
    const res = await fetch('/api/pages/restore',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ id })
    });
    const data = await res.json();
    if(data.success){
      alert('Content restored successfully ✅');
      loadDeleted();
    }else{
      alert('Restore failed ❌');
    }
  }catch(e){
    alert('Restore failed ❌');
  }
}

loadDeleted();
</script>
</body>
</html>
