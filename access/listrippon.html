<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Ribbons • Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #eef2ff;
  --dark: #0f172a;
  --slate-700: #334155;
  --slate-500: #64748b;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --white: #ffffff;
  --radius-sm: 8px;
  --radius-md: 14px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  background: #f8fafc;
  color: var(--dark);
  padding: 40px 24px;
}

.container {
  max-width: 900px;
  margin: 0 auto;
}

.top-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--slate-200);
}

.header-left h1 {
  font-size: 26px;
  font-weight: 800;
  color: var(--dark);
}

.header-left p {
  color: var(--slate-500);
  font-size: 14px;
  margin-top: 4px;
}

.header-actions {
  display: flex;
  gap: 12px;
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s ease;
}

.btn-secondary {
  background: var(--white);
  color: var(--slate-700);
  border: 1px solid var(--slate-200);
}

.btn-secondary:hover {
  background: var(--slate-100);
}

.btn-primary {
  background: var(--primary);
  color: var(--white);
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
}

.btn-primary:hover {
  background: var(--primary-hover);
  transform: translateY(-2px);
}

.card {
  background: var(--white);
  border-radius: var(--radius-md);
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  border: 1px solid var(--slate-200);
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: var(--slate-100);
  border-bottom: 1px solid var(--slate-200);
}

th {
  padding: 14px 20px;
  text-align: left;
  font-size: 13px;
  font-weight: 700;
  color: var(--slate-700);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

td {
  padding: 16px 20px;
  font-size: 14px;
  border-bottom: 1px solid var(--slate-200);
  color: var(--dark);
}

tbody tr:hover {
  background: #f8fafc;
}

.badge-tag {
  display: inline-block;
  background: var(--primary-light);
  color: var(--primary);
  padding: 5px 12px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 13px;
}

.actions {
  display: flex;
  gap: 8px;
}

.actions button {
  padding: 6px 14px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.edit {
  background: var(--primary-light);
  color: var(--primary);
  border: 1px solid rgba(79, 70, 229, 0.2);
}

.edit:hover {
  background: #e0e7ff;
}

.delete {
  background: #fee2e2;
  color: #dc2626;
}

.delete:hover {
  background: #fecaca;
}

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.modal-box {
  background: var(--white);
  padding: 26px;
  border-radius: var(--radius-md);
  width: 100%;
  max-width: 380px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
}

.modal-box h3 {
  margin-bottom: 12px;
  font-size: 18px;
  color: var(--dark);
}

.modal-box input {
  width: 100%;
  padding: 11px 14px;
  margin: 10px 0 16px;
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-sm);
  font-size: 14px;
  outline: none;
}

.modal-box input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}

.modal-actions {
  display: flex;
  gap: 10px;
}

.modal-actions button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.save {
  background: var(--primary);
  color: var(--white);
}

.cancel {
  background: var(--slate-100);
  color: var(--slate-700);
}
</style>
</head>

<body>

<div class="container">
    <div class="top-header">
        <div class="header-left">
            <h1>Promotional Ribbons</h1>
            <p>Manage product badge labels used across the storefront</p>
        </div>
        <div class="header-actions">
            <a href="/controls" class="nav-btn btn-secondary">← Back to Dashboard</a>
            <a href="/rippon" class="nav-btn btn-primary">+ Add New Ribbon</a>
        </div>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th style="width: 80px;">#</th>
                    <th>Ribbon Badge</th>
                    <th style="width: 180px;">Actions</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">
    <div class="modal-box">
        <h3>Edit Ribbon</h3>
        <input type="text" id="editInput" placeholder="Enter ribbon name">
        <div class="modal-actions">
            <button class="cancel" onclick="closeModal()">Cancel</button>
            <button class="save" onclick="saveEdit()">Save Changes</button>
        </div>
    </div>
</div>

<script>
let currentRibbon = "";

async function loadRippons(){
    const res = await fetch('/api/ribbons');
    const data = await res.json();
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = "";

    if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:30px; color:#64748b;">No ribbons created yet. Click "+ Add New Ribbon" to create one.</td></tr>';
        return;
    }

    data.forEach((r,i)=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${i+1}</td>
            <td><span class="badge-tag">${r}</span></td>
            <td>
                <div class="actions">
                    <button class="edit" onclick="openEdit('${r}')">Edit</button>
                    <button class="delete" onclick="deleteRippon('${r}')">Delete</button>
                </div>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function openEdit(ribbon){
    currentRibbon = ribbon;
    document.getElementById('editInput').value = ribbon;
    document.getElementById('editModal').style.display='flex';
}

function closeModal(){
    document.getElementById('editModal').style.display='none';
}

async function saveEdit(){
    const newRibbon = document.getElementById('editInput').value.trim();
    if(!newRibbon) return alert("Value required");

    const res = await fetch('/api/ribbon/edit',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ oldRibbon: currentRibbon, newRibbon })
    });

    const data = await res.json();
    if(data.success){
        closeModal();
        loadRippons();
    }else{
        alert("Update failed");
    }
}

async function deleteRippon(ribbon){
    if(!confirm(`Delete "${ribbon}" permanently?`)) return;

    const res = await fetch('/api/ribbon/delete',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ ribbon })
    });

    const data = await res.json();
    if(data.success){
        loadRippons();
    }else{
        alert("Delete failed");
    }
}

loadRippons();
</script>

</body>
</html>
