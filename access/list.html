<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page Content Manager • Live CMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #eef2ff;
  --dark: #0f172a;
  --slate-700: #334155;
  --slate-500: #64748b;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --white: #ffffff;
  --radius-sm: 8px;
  --radius-md: 14px;
  --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  background: #f8fafc;
  color: var(--dark);
  padding: 40px 24px;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
}

/* TOP HEADER */
.top-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--slate-200);
}

.header-left h1 {
  font-size: 26px;
  font-weight: 800;
  color: var(--dark);
}

.header-left p {
  color: var(--slate-500);
  font-size: 14px;
  margin-top: 4px;
}

.header-actions {
  display: flex;
  gap: 10px;
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s ease;
}

.btn-secondary {
  background: var(--white);
  color: var(--slate-700);
  border: 1px solid var(--slate-200);
}

.btn-secondary:hover {
  background: var(--slate-100);
}

.btn-danger {
  background: #fee2e2;
  color: #dc2626;
  border: 1px solid #fecaca;
}

.btn-danger:hover {
  background: #fecaca;
}

.btn-primary {
  background: var(--primary);
  color: var(--white);
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
}

.btn-primary:hover {
  background: var(--primary-hover);
}

/* ================= TABS ================= */
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.tab {
  padding: 11px 22px;
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  color: var(--slate-700);
  text-transform: capitalize;
  transition: all 0.2s ease;
}

.tab:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.tab.active {
  background: var(--primary);
  color: var(--white);
  border-color: var(--primary);
  box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
}

/* ================= SECTIONS & CARDS ================= */
.section {
  display: none;
}

.section.active {
  display: block;
}

.card {
  background: var(--white);
  border-radius: var(--radius-md);
  padding: 26px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-card);
  border: 1px solid var(--slate-200);
}

.card h3 {
  margin-bottom: 20px;
  font-size: 18px;
  font-weight: 800;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--slate-200);
  color: var(--dark);
  text-transform: capitalize;
}

/* ================= FIELD ================= */
.field {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  padding: 14px 0;
  border-bottom: 1px solid var(--slate-100);
}

.field:last-child {
  border-bottom: none;
}

.field-left {
  max-width: 75%;
  font-size: 14px;
  line-height: 1.6;
}

.field-left strong {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  color: var(--slate-500);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}

.field-left span {
  display: block;
  color: var(--dark);
  font-weight: 500;
  word-break: break-word;
}

.image-preview {
  width: 140px;
  height: 100px;
  object-fit: contain;
  border-radius: var(--radius-sm);
  border: 1px solid var(--slate-200);
  background: #f8fafc;
  margin-top: 6px;
  padding: 6px;
  display: block;
}

/* ================= ACTIONS ================= */
.actions {
  display: flex;
  gap: 8px;
}

.btn {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s ease;
}

.edit {
  background: var(--primary-light);
  color: var(--primary);
  border: 1px solid rgba(79, 70, 229, 0.2);
}

.edit:hover {
  background: #e0e7ff;
}

.delete {
  background: #fee2e2;
  color: #dc2626;
  border: 1px solid #fecaca;
}

.delete:hover {
  background: #fecaca;
}

/* ================= MODAL ================= */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal {
  background: var(--white);
  width: 540px;
  max-width: 95%;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
}

.modal-header {
  padding: 16px 20px;
  background: var(--dark);
  color: var(--white);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  font-size: 16px;
}

.modal-header button {
  background: none;
  border: none;
  color: var(--white);
  font-size: 18px;
  cursor: pointer;
}

.modal-body {
  padding: 24px;
}

.modal-footer {
  padding: 16px 24px;
  background: var(--slate-100);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

select, textarea, input[type=file] {
  width: 100%;
  padding: 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--slate-200);
  font-size: 14px;
  outline: none;
  margin-top: 8px;
}

textarea {
  min-height: 110px;
  resize: vertical;
  font-family: inherit;
}

select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}

.save {
  background: var(--primary);
  color: var(--white);
  padding: 10px 22px;
  font-size: 14px;
  font-weight: 700;
}

.save:hover {
  background: var(--primary-hover);
}
</style>
</head>

<body>
<div class="container">
  <div class="top-header">
    <div class="header-left">
      <h1>Live Page Content Manager</h1>
      <p>Visual CMS editor: update headings, details, banners, and sections in real-time</p>
    </div>
    <div class="header-actions">
      <a href="/controls" class="nav-btn btn-secondary">← Back to Dashboard</a>
      <a href="/deleted" class="nav-btn btn-danger">♻️ Deleted Items</a>
      <a href="/home" target="_blank" class="nav-btn btn-primary">👁️ View Live Website</a>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="sections"></div>
</div>

<script>
let pagesData;
let ribbons=[];
let categories=[];

/* LOAD DATA */
Promise.all([
  fetch('/api/pages').then(r=>r.json()),
  fetch('/api/ribbons').then(r=>r.json()),
  fetch('/api/categories').then(r=>r.json())
]).then(([p,r,c])=>{
  pagesData=p.pages;
  ribbons=r;
  categories=c.map(x=>x.category);
  buildTabs();
  buildSections();
  openTab(0);
});

/* TABS */
function buildTabs(){
  const t=document.getElementById('tabs');
  t.innerHTML = '';
  Object.keys(pagesData).forEach((k,i)=>{
    const d=document.createElement('div');
    d.className='tab'+(i===0?' active':'');
    d.innerText=k;
    d.onclick=()=>openTab(i);
    t.appendChild(d);
  });
}
function openTab(i){
  document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));
  document.querySelectorAll('.section').forEach((s,idx)=>s.classList.toggle('active',idx===i));
}

/* SECTIONS */
function buildSections(){
  const c=document.getElementById('sections');
  c.innerHTML='';
  Object.entries(pagesData).forEach(([k,v])=>{
    const s=document.createElement('div');
    s.className='section';
    s.innerHTML=renderObject(v,k,k);
    c.appendChild(s);
  });
}

/* RENDER */
function renderObject(obj,title,path){
  // Always guarantee categories array exists for page1 so Category Section is NEVER omitted
  if (path === "page1" && !("categories" in obj)) {
    obj.categories = [];
  }

  let html=`<div class="card"><h3>${title}</h3>`;
  let i=1;
  Object.entries(obj).forEach(([k,v])=>{
    if (path === "page1" && k.toLowerCase() === "categories") {
      html += renderCategoriesSection(v || [], `${i++}. Categories (Showcase)`, `${path}.${k}`);
    } else {
      html += renderValue(v,`${i++}. ${k}`,`${path}.${k}`);
    }
  });
  return html+'</div>';
}

function escapeHtml(str){
  if(str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function escapeJs(str){
  if(str == null) return '';
  return String(str)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;');
}

function renderCategoriesSection(catList, label, basePath){
  const rawList = Array.isArray(catList) ? catList : [];
  const activeItems = rawList.filter(c => c && typeof c === 'string' && c.trim() !== '');

  let html = `
  <div class="card categories-card" style="border: 1px solid var(--slate-200); position: relative; margin-top: 14px; margin-bottom: 24px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--slate-200);">
      <div style="display:flex; align-items:center; gap:10px;">
        <h3 style="margin:0; padding:0; border:none; font-size:18px; font-weight:800; color:var(--dark); text-transform:none;">
          ${label}
        </h3>
        <span style="background:var(--primary-light); color:var(--primary); font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px;">
          ${activeItems.length} ${activeItems.length === 1 ? "Category" : "Categories"}
        </span>
      </div>
      <button class="btn" onclick="openAddCategoryModal()" style="display:inline-flex; align-items:center; gap:6px; background:var(--primary); color:#ffffff; font-size:13px; font-weight:700; padding:8px 16px; border-radius:6px; border:none; cursor:pointer;">
        <span style="font-size:16px; line-height:1;">+</span> Add Category
      </button>
    </div>`;

  if (activeItems.length === 0) {
    html += `
    <div style="text-align:center; padding:28px 20px; background:#f8fafc; border-radius:8px; border:2px dashed #cbd5e1; margin-bottom:8px;">
      <div style="font-size:28px; margin-bottom:6px;">🏷️</div>
      <p style="font-size:14px; font-weight:700; color:var(--dark); margin:0 0 4px 0;">No Categories Currently Pinned</p>
      <p style="font-size:13px; color:var(--slate-500); margin:0 0 14px 0;">
        The live website is currently showing default categories from your store catalog. You can customize which categories appear in the showcase below.
      </p>
      <button class="btn" onclick="openAddCategoryModal()" style="background:var(--primary); color:#ffffff; font-weight:700; padding:8px 18px; font-size:13px; border-radius:6px; border:none; cursor:pointer;">
        + Pin Category to Showcase
      </button>
    </div>`;
  } else {
    let displayNum = 1;
    rawList.forEach((cat, realIndex) => {
      if (!cat || typeof cat !== 'string' || !cat.trim()) return;
      const fieldPath = `${basePath}.${realIndex}`;
      html += `
      <div class="field">
        <div class="field-left">
          <strong>${displayNum++}. CATEGORY</strong>
          <span style="display:flex; align-items:center; gap:8px; margin-top:4px;">
            <span style="display:inline-block; padding:4px 12px; background:#f1f5f9; color:#1e293b; border-radius:6px; border:1px solid #e2e8f0; font-weight:700;">
              📁 ${escapeHtml(cat)}
            </span>
          </span>
        </div>
        <div class="actions">
          <button class="btn edit" onclick="editField('${fieldPath}', '${escapeJs(cat)}')">Edit</button>
          <button class="btn delete" onclick="deleteField('${fieldPath}', '${escapeJs(cat)}', 'text')">Delete</button>
        </div>
      </div>`;
    });
  }

  html += `</div>`;
  return html;
}

function renderValue(v,label,path){
  if(v==null) return '';
  if(Array.isArray(v)){
    return v.map((x,i)=>renderValue(x,`${label}.${i+1}`,`${path}.${i}`)).join('');
  }
  if(typeof v==='object'){
    return renderObject(v,label,path);
  }

  const isImg=/\.(png|jpg|jpeg|webp)$/i.test(v);
  return `
  <div class="field">
    <div class="field-left">
      <strong>${label}</strong>
      ${isImg?`<img src="/uploads/${v}" class="image-preview" alt="Preview">`:`<span>${v}</span>`}
    </div>
    <div class="actions">
      <button class="btn edit" onclick="editField('${path}','${v}')">Edit</button>
      <button class="btn delete" onclick="deleteField('${path}','${v}','${isImg?'image':'text'}')">Delete</button>
    </div>
  </div>`;
}

/* EDIT */
function editField(path,value){
  const m=modal();
  const title = m.querySelector('.modal-header');
  if (title && title.childNodes[0]) title.childNodes[0].textContent = 'Edit Field Value ';
  const saveBtn = m.querySelector('.save');
  if (saveBtn) {
    saveBtn.textContent = 'Save Changes';
    saveBtn.disabled = false;
  }

  const b=m.querySelector('.modal-body');
  b.innerHTML='';

  /* IMAGE WITH PREVIEW */
  if(/\.(png|jpg|jpeg|webp)$/i.test(value)){
    const img=document.createElement('img');
    img.src='/uploads/'+value;
    img.style.width='100%';
    img.style.maxHeight='220px';
    img.style.objectFit='contain';
    img.style.border='1px solid #e2e8f0';
    img.style.borderRadius='8px';
    img.style.marginBottom='10px';
    img.style.background='#f8fafc';

    const input=document.createElement('input');
    input.type='file';
    input.id='imgFile';
    input.accept='image/*';

    /* LIVE PREVIEW */
    input.onchange=()=>{
      if(input.files[0]){
        img.src=URL.createObjectURL(input.files[0]);
      }
    };

    b.append(img,input);
  }

  /* RIBBON */
  else if(path.toLowerCase().includes('ribbon')){
    b.append(selectBox(ribbons,value));
  }

  /* CATEGORY */
  else if(path.includes('.categories.')){
    b.append(selectBox(categories,value));
  }

  /* TEXT */
  else{
    const t=document.createElement('textarea');
    t.value=value;
    b.appendChild(t);
  }

  m.querySelector('.save').onclick=()=>save(path,b);
  m.style.display='flex';
}

/* SELECT */
function selectBox(data,val){
  const s=document.createElement('select');
  data.forEach(d=>{
    const o=new Option(d,d,d===val,d===val);
    s.appendChild(o);
  });
  return s;
}

/* SAVE */
async function save(path,b){
  const fd=new FormData();
  fd.append('path',path);
  const f=b.querySelector('#imgFile');
  if(f){
    if(!f.files[0]) return alert('Select image');
    fd.append('file',f.files[0]);
  }else{
    fd.append('value',b.querySelector('select,textarea').value);
  }
  await fetch('/api/pages/update-field',{method:'POST',body:fd});
  location.reload();
}

/* DELETE */
async function deleteField(path,value,type){
  if(!confirm('Move this field to the Recycle Bin? You can restore it anytime from Deleted Items.')) return;
  await fetch('/api/pages/delete',{
    method:'DELETE',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({path,value,type})
  });
  location.reload();
}

/* MODAL */
function modal(){
  let m=document.getElementById('modal');
  if(m) return m;
  m=document.createElement('div');
  m.id='modal';
  m.className='modal-overlay';
  m.innerHTML=`
  <div class="modal">
    <div class="modal-header">
      Edit Field Value
      <button onclick="this.closest('.modal-overlay').style.display='none'">✕</button>
    </div>
    <div class="modal-body"></div>
    <div class="modal-footer">
      <button class="btn save">Save Changes</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  return m;
}
/* CATEGORY SHOWCASE ACTIONS */
function openAddCategoryModal(){
  const m = modal();
  const title = m.querySelector(".modal-header");
  if (title && title.childNodes[0]) title.childNodes[0].textContent = "Add Category to Showcase ";
  const b = m.querySelector(".modal-body");
  b.innerHTML = "";

  const desc = document.createElement("p");
  desc.style.fontSize = "14px";
  desc.style.color = "var(--slate-500)";
  desc.style.marginBottom = "14px";
  desc.textContent = "Select an existing category from your store or enter a category name:";
  b.appendChild(desc);

  const sel = document.createElement("select");
  sel.id = "newCategorySelect";
  const currentPinned = (pagesData?.page1?.categories || []).filter(c => c && typeof c === "string");

  if (!categories || categories.length === 0) {
    sel.innerHTML = "<option value=''>-- No categories in store catalog yet --</option>";
  } else {
    sel.innerHTML = "<option value=''>-- Select from store catalog --</option>";
    categories.forEach(c => {
      const isAlreadyPinned = currentPinned.includes(c);
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = (c.charAt(0).toUpperCase() + c.slice(1)) + (isAlreadyPinned ? " (Already in showcase)" : "");
      sel.appendChild(opt);
    });
  }
  b.appendChild(sel);

  const orText = document.createElement("div");
  orText.style.margin = "12px 0 6px";
  orText.style.fontSize = "13px";
  orText.style.fontWeight = "600";
  orText.style.color = "var(--slate-500)";
  orText.textContent = "Or enter category name directly:";
  
  const customInput = document.createElement("input");
  customInput.type = "text";
  customInput.placeholder = "e.g. Electronics, Fashion, Toys";
  customInput.style.width = "100%";
  customInput.style.padding = "10px 12px";
  customInput.style.border = "1px solid var(--slate-200)";
  customInput.style.borderRadius = "var(--radius-sm)";
  customInput.style.fontSize = "14px";

  b.appendChild(orText);
  b.appendChild(customInput);

  const saveBtn = m.querySelector(".save");
  saveBtn.textContent = "+ Add to Showcase";
  saveBtn.disabled = false;
  saveBtn.onclick = async () => {
    const val = (customInput.value && customInput.value.trim()) || sel.value;
    if (!val) return alert("Please select or enter a category name");
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";
    try {
      const res = await fetch("/api/pages/category/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category: val })
      });
      const data = await res.json();
      if (data.success) {
        location.reload();
      } else {
        alert(data.error || "Failed to add category");
        saveBtn.disabled = false;
        saveBtn.textContent = "+ Add to Showcase";
      }
    } catch (err) {
      alert("Error: " + err.message);
      saveBtn.disabled = false;
      saveBtn.textContent = "+ Add to Showcase";
    }
  };

  m.style.display = "flex";
}
</script>
</body>
</html>
