<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Products • Admin Catalog</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #eef2ff;
  --dark: #0f172a;
  --slate-700: #334155;
  --slate-500: #64748b;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --white: #ffffff;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-hover: 0 15px 30px -5px rgba(0, 0, 0, 0.12);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  margin: 0;
  padding: 40px 24px;
  background: #f8fafc;
  color: var(--dark);
}

.container {
  max-width: 1300px;
  margin: 0 auto;
}

/* ===== HEADER ===== */
.top-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--slate-200);
}

.header-left h1 {
  font-size: 26px;
  font-weight: 800;
  color: var(--dark);
}

.header-left p {
  color: var(--slate-500);
  font-size: 14px;
  margin-top: 4px;
}

.header-actions {
  display: flex;
  gap: 12px;
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s ease;
}

.btn-secondary {
  background: var(--white);
  color: var(--slate-700);
  border: 1px solid var(--slate-200);
}

.btn-secondary:hover {
  background: var(--slate-100);
}

.btn-primary {
  background: var(--primary);
  color: var(--white);
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
}

.btn-primary:hover {
  background: var(--primary-hover);
  transform: translateY(-2px);
}

/* ===== GRID ===== */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 24px;
}

/* ===== CARD ===== */
.product-card {
  background: var(--white);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  border: 1px solid var(--slate-200);
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  transition: all 0.25s ease;
}

.product-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
  border-color: #cbd5e1;
}

/* ===== RIBBON ===== */
.ribbon {
  position: absolute;
  top: 14px;
  left: 14px;
  background: var(--primary);
  color: var(--white);
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  z-index: 2;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
}

.ribbon.trending { background: #ea580c; }
.ribbon.new { background: #10b981; }
.ribbon.sale { background: #8b5cf6; }
.ribbon.hot { background: #ef4444; }
.ribbon.featured { background: #0284c7; }
.ribbon.limited { background: #6366f1; }
.ribbon.best { background: #059669; }
.ribbon.offer { background: #f59e0b; }

/* ===== IMAGE ===== */
.image-box {
  height: 220px;
  background: #f1f5f9;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.image-box img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transition: transform 0.3s ease;
}

.product-card:hover .image-box img {
  transform: scale(1.05);
}

/* ===== CONTENT ===== */
.content {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.title {
  font-size: 17px;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 6px;
  line-height: 1.3;
}

.meta {
  font-size: 12px;
  color: var(--slate-500);
  margin-bottom: 10px;
  line-height: 1.5;
}

.desc {
  font-size: 13px;
  color: var(--slate-700);
  line-height: 1.5;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ===== PRICE ===== */
.price-box {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.price {
  font-size: 20px;
  font-weight: 800;
  color: #10b981;
}

.old-price {
  font-size: 14px;
  color: #94a3b8;
  text-decoration: line-through;
}

.discount {
  font-size: 12px;
  font-weight: 700;
  color: #dc2626;
  background: #fee2e2;
  padding: 3px 8px;
  border-radius: 4px;
}

/* ===== DELIVERY & STOCK ===== */
.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.delivery-badge {
  font-size: 12px;
  background: var(--slate-100);
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  color: var(--slate-700);
  font-weight: 500;
}

.stock-badge {
  font-size: 12px;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 999px;
}

.stock-in { background: #dcfce7; color: #166534; }
.stock-out { background: #fee2e2; color: #991b1b; }

.date {
  font-size: 12px;
  color: var(--slate-500);
  margin-bottom: 16px;
}

/* ===== ACTIONS ===== */
.actions {
  display: flex;
  gap: 10px;
  margin-top: auto;
}

.actions button {
  flex: 1;
  padding: 10px 14px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.edit {
  background: var(--primary);
  color: var(--white);
}

.edit:hover {
  background: var(--primary-hover);
}

.delete {
  background: #fee2e2;
  color: #dc2626;
}

.delete:hover {
  background: #fecaca;
}

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--slate-500);
  grid-column: 1 / -1;
  font-size: 16px;
}
</style>
</head>
<body>

<div class="container">
    <div class="top-header">
        <div class="header-left">
            <h1>Catalog Management</h1>
            <p>View, modify pricing, update stock status, and manage all store items</p>
        </div>
        <div class="header-actions">
            <a href="/controls" class="nav-btn btn-secondary">← Back to Dashboard</a>
            <a href="/prod" class="nav-btn btn-primary">+ Add New Product</a>
        </div>
    </div>

    <div id="productGrid" class="product-grid"></div>
</div>

<script>
const grid = document.getElementById('productGrid');

/* ===== LOAD PRODUCTS ===== */
async function loadProducts(){
    try{
        const res = await fetch('/products');
        const products = await res.json();

        if(!products.length){
            grid.innerHTML = '<div class="empty">No products found in catalog. Click "+ Add New Product" to create one.</div>';
            return;
        }

        grid.innerHTML = '';
        products.forEach(p=>{
            const card = document.createElement('div');
            card.className = 'product-card';

            const ribbonClass =
              p.ribbon === 'Trending' ? 'trending' :
              p.ribbon === 'New Arrival' ? 'new' :
              p.ribbon === 'Sale' ? 'sale' :
              p.ribbon === 'Hot' ? 'hot' :
              p.ribbon === 'Featured' ? 'featured' :
              p.ribbon === 'Limited' ? 'limited' :
              p.ribbon === 'Best' ? 'best' :
              p.ribbon === 'Offer' ? 'offer' : '';

            card.innerHTML = `
                ${p.ribbon ? `<div class="ribbon ${ribbonClass}">${p.ribbon}</div>` : ``}

                <div class="image-box">
                    <img src="/uploads/${p.image}" alt="${p.name}">
                </div>

                <div class="content">
                    <div class="title">${p.name}</div>

                    <div class="meta">
                        <strong>Category:</strong> ${p.category ? p.category.join(', ') : ''}<br>
                        <strong>Sub Category:</strong> ${p.subCategory ? p.subCategory.join(', ') : ''}
                    </div>

                    <div class="desc">${p.description}</div>

                    <div class="price-box">
                        <div class="price">₹${p.price}</div>
                        <div class="old-price">₹${p.oldPrice}</div>
                        ${p.discount ? `<div class="discount">${p.discount}% OFF</div>` : ``}
                    </div>

                    <div class="badge-row">
                        <div class="delivery-badge">🚚 ${p.delivery}</div>
                        <div class="stock-badge ${p.stock==='out' ? 'stock-out' : 'stock-in'}">
                            ${p.stock==='out' ? 'Out of Stock' : 'In Stock'}
                        </div>
                    </div>

                    <div class="date">
                        Added: ${new Date(p.createdAt).toLocaleDateString()}
                    </div>

                    <div class="actions">
                        <button class="edit" onclick="editProduct('${p._id}')">Edit Product</button>
                        <button class="delete" onclick="deleteProduct('${p._id}')">Delete</button>
                    </div>
                </div>
            `;

            grid.appendChild(card);
        });

    }catch(err){
        console.error(err);
        grid.innerHTML = '<div class="empty">Failed to load products. Check server connection.</div>';
    }
}

/* ===== EDIT ===== */
function editProduct(id){
    window.location.href = '/edit-product?id=' + id;
}

/* ===== DELETE ===== */
async function deleteProduct(id){
    if(!confirm('Are you sure you want to delete this product permanently?')) return;

    const res = await fetch('/api/product/delete/' + id, { method:'POST' });
    const data = await res.json();

    if(data.success){
        alert('Product deleted successfully ✅');
        location.reload();
    }else{
        alert('Delete failed ❌');
    }
}

loadProducts();
</script>

</body>
</html>
