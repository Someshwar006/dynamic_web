<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Setup • Admin</title>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --dark: #0f172a;
            --slate-700: #334155;
            --slate-500: #64748b;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --white: #ffffff;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2f7, #dbe3ef);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--dark);
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--slate-200);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--slate-200);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            background: var(--primary-light);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: #e0e7ff;
            transform: translateX(-2px);
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 800;
            color: var(--dark);
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 16px 0 6px;
            color: var(--slate-700);
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--slate-200);
            margin-bottom: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* IMAGE PREVIEW */
        .preview-box {
            width: 100%;
            height: 200px;
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--slate-100);
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .preview-text {
            color: var(--slate-500);
            font-size: 14px;
        }

        input[type="file"] {
            padding: 10px;
            background: var(--slate-100);
            cursor: pointer;
        }

        .add-btn {
            background: var(--primary-light);
            color: var(--primary);
            border: 1px dashed var(--primary);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            margin-top: 4px;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .add-btn:hover {
            background: #e0e7ff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: var(--white);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 700;
            margin-top: 24px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transition: all 0.25s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="top-bar">
        <a href="/controls" class="back-btn">← Back to Dashboard</a>
        <span style="font-size: 12px; color: var(--slate-500);">Category Creator</span>
    </div>

    <h1>Category Setup</h1>

    <form action="/category" method="POST" enctype="multipart/form-data">

        <!-- IMAGE UPLOAD -->
        <label>Category Image / Icon</label>
        <div class="preview-box">
            <span class="preview-text">Image Preview</span>
            <img id="previewImage">
        </div>

        <input type="file" name="categoryImage" id="imageInput" required>

        <!-- CATEGORY -->
        <label>Category Name</label>
        <input type="text" name="category" placeholder="e.g. Footwear, Electronics, Clothing" required>

        <!-- SUB CATEGORY -->
        <label>Sub Categories</label>
        <div id="subCategoryContainer">
            <input type="text" name="subcategory[]" placeholder="e.g. Running Shoes" required>
        </div>

        <button type="button" class="add-btn" id="addSubCategory">
            + Add Another Sub-Category
        </button>

        <button type="submit" class="submit-btn">
            Save & Publish Category
        </button>
    </form>
</div>

<script>
    /* SUB CATEGORY LOGIC */
    const addBtn = document.getElementById("addSubCategory");
    const container = document.getElementById("subCategoryContainer");
    const maxFields = 8;

    addBtn.addEventListener("click", () => {
        if (container.children.length < maxFields) {
            const input = document.createElement("input");
            input.type = "text";
            input.name = "subcategory[]";
            input.placeholder = "Enter sub-category";
            input.required = true;
            container.appendChild(input);
        }

        if (container.children.length === maxFields) {
            addBtn.style.display = "none";
        }
    });

    /* IMAGE PREVIEW LOGIC */
    const imageInput = document.getElementById("imageInput");
    const previewImage = document.getElementById("previewImage");
    const previewText = document.querySelector(".preview-text");

    imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];

        if (file) {
            previewImage.src = URL.createObjectURL(file);
            previewImage.style.display = "block";
            previewText.style.display = "none";
        } else {
            previewImage.style.display = "none";
            previewText.style.display = "block";
        }
    });
</script>

</body>
</html>
