<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ribbon Setup • Admin</title>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --dark: #0f172a;
            --slate-700: #334155;
            --slate-500: #64748b;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --white: #ffffff;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2f7, #dbe3ef);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--dark);
        }

        .form-container {
            background: var(--white);
            width: 100%;
            max-width: 520px;
            padding: 36px;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--slate-200);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--slate-200);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            background: var(--primary-light);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: #e0e7ff;
            transform: translateX(-2px);
        }

        .form-container h2 {
            text-align: center;
            color: var(--dark);
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .form-container p {
            text-align: center;
            font-size: 14px;
            color: var(--slate-500);
            margin-bottom: 28px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-row input {
            flex: 1;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--slate-200);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-row input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .remove-btn {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .remove-btn:hover {
            background: #fecaca;
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            margin: 16px 0 24px;
            background: var(--primary-light);
            border: 1px dashed var(--primary);
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-btn:hover {
            background: #e0e7ff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: var(--white);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transition: all 0.25s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="top-bar">
        <a href="/controls" class="back-btn">← Back to Dashboard</a>
        <span style="font-size: 12px; color: var(--slate-500);">Marketing Badges</span>
    </div>

    <h2>Add Promotional Ribbons</h2>
    <p>Create badge labels (e.g. "Trending", "New Arrival", "50% OFF")</p>

    <form action="/rippon" method="post">
        <div id="inputGroup">
            <div class="input-row">
                <input type="text" name="ribbon" placeholder="e.g. Trending, Hot Deal, Best Seller" required>
            </div>
        </div>

        <button type="button" class="add-btn" id="addField">+ Add Another Ribbon Field</button>
        <button type="submit" class="submit-btn">Save Ribbons</button>
    </form>
</div>

<script>
    const inputGroup = document.getElementById("inputGroup");
    document.getElementById("addField").onclick = () => {
        const row = document.createElement("div");
        row.className = "input-row";
        row.innerHTML = `
            <input type="text" name="ribbon" placeholder="e.g. Special Offer" required>
            <button type="button" class="remove-btn" title="Remove">&times;</button>
        `;
        row.querySelector(".remove-btn").onclick = () => row.remove();
        inputGroup.appendChild(row);
    };
</script>

</body>
</html>
